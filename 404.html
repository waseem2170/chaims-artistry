<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#210204">
<meta name="description" content="CHAIMS Artistry. Coming soon. A new beauty experience.">
<title>CHAIMS Artistry · Coming soon</title>
<style>
*{box-sizing:border-box}html{background:#210204}body{margin:0;color:#efd2a4;background:radial-gradient(ellipse at 50% 48%,#2a0407 0%,#210204 62%,#190103 100%);font-family:Arial,sans-serif;min-height:100svh;display:grid;place-items:center;overflow-x:hidden}main{width:min(88%,760px);padding:48px 0;text-align:center;transform:translateY(1.5vh)}.logo{position:relative;width:86%;max-width:620px;aspect-ratio:3.4;margin:0 auto;animation:logo-reveal 1.1s cubic-bezier(.25,.6,.3,1) .15s both}.logo:before{content:"";position:absolute;inset:-35% 0;background:linear-gradient(110deg,#f7dfb6,#e9bf86 48%,#f7dfb6);mask:url('assets/logo-transparent.png') center/100% auto no-repeat;-webkit-mask:url('assets/logo-transparent.png') center/100% auto no-repeat}.divider{width:clamp(110px,28vw,230px);height:1px;margin:clamp(32px,6vh,62px) auto;background:linear-gradient(90deg,transparent,#edc88f 35%,#fff0ce 50%,#edc88f 65%,transparent);transform-origin:center;animation:expand 1.5s cubic-bezier(.22,.61,.36,1) .8s both}h1{margin:0;font:400 clamp(21px,4.5vw,38px)/1.4 Georgia,'Times New Roman',serif;letter-spacing:.48em;text-indent:.48em;animation:reveal 1.5s ease 1.7s both}p{margin:0 0 22px;font-size:clamp(9px,2.1vw,14px);line-height:1.8;letter-spacing:.42em;text-indent:.42em;animation:reveal 1.5s ease 1.3s both}@keyframes logo-reveal{from{clip-path:inset(0 100% 0 0);opacity:0;transform:translateY(8px)}to{clip-path:inset(0);opacity:1;transform:translateY(0)}}@keyframes reveal{from{opacity:0;translate:0 14px;filter:blur(3px)}to{opacity:1;translate:0 0;filter:blur(0)}}@keyframes expand{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}@media(prefers-reduced-motion:reduce){.logo,.divider,h1,p{animation:none}}@media(max-height:450px){main{padding:28px 0;transform:none}.logo{max-width:340px}.divider{margin:22px auto}p{margin-bottom:12px}}
</style>
</head>
<body><main><div class="logo" role="img" aria-label="CHAIMS Artistry"></div><div class="divider" aria-hidden="true"></div><p>A NEW BEAUTY EXPERIENCE</p><h1>COMING SOON</h1></main></body>
</html>
